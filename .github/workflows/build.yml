name: Build NintendoSwitchPkg

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Cancel any in-progress run for the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    name: Static script checks
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2 — pinned to immutable commit SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Syntax-check shell scripts
        run: |
          for f in scripts/fetch-deps.sh scripts/build.sh scripts/collect-artifacts.sh; do
            echo "Checking $f ..."
            bash -n "$f"
          done
          echo "All shell scripts pass syntax check."

      - name: Validate Makefile (help target dry-run)
        run: make help

  build-amd64:
    name: Firmware build — Docker linux/amd64 (x64 runner, same path as Intel macOS)
    runs-on: ubuntu-22.04
    needs: static-checks
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2 — pinned to immutable commit SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v3.10.0 — pinned to immutable commit SHA
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      - name: Build firmware via Docker (linux/amd64)
        run: make docker-build PLATFORM=linux/amd64

      - name: Verify artifacts and checksums
        run: |
          test -s out/TEGRA210_EFI.fd  || { echo "ERROR: TEGRA210_EFI.fd missing or empty"; exit 1; }
          test -s out/TEGRA210_EFI.elf || { echo "ERROR: TEGRA210_EFI.elf missing or empty"; exit 1; }
          test -s out/SHA256SUMS       || { echo "ERROR: SHA256SUMS missing or empty"; exit 1; }
          echo "=== Artifact listing ==="
          ls -lh out/
          echo ""
          echo "=== SHA-256 checksums ==="
          cat out/SHA256SUMS
          echo ""
          echo "=== Verifying checksums ==="
          (cd out && sha256sum --check SHA256SUMS)

      - name: Upload firmware artifacts
        # actions/upload-artifact v4.6.2 — pinned to immutable commit SHA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NintendoSwitchPkg-firmware-amd64-${{ github.sha }}
          path: out/
          retention-days: 30
          if-no-files-found: error

  build-arm64:
    name: Firmware build — Docker linux/arm64 (QEMU, validates Apple Silicon path)
    runs-on: ubuntu-22.04
    needs: static-checks
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2 — pinned to immutable commit SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up QEMU for multi-platform builds
        # docker/setup-qemu-action v3.6.0 — pinned to immutable commit SHA
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff9c45c9d8d2a71c771

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v3.10.0 — pinned to immutable commit SHA
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      - name: Build firmware via Docker (linux/arm64 under QEMU)
        run: make docker-build PLATFORM=linux/arm64

      - name: Verify artifacts and checksums
        run: |
          test -s out/TEGRA210_EFI.fd  || { echo "ERROR: TEGRA210_EFI.fd missing or empty"; exit 1; }
          test -s out/TEGRA210_EFI.elf || { echo "ERROR: TEGRA210_EFI.elf missing or empty"; exit 1; }
          test -s out/SHA256SUMS       || { echo "ERROR: SHA256SUMS missing or empty"; exit 1; }
          echo "=== Artifact listing ==="
          ls -lh out/
          echo ""
          echo "=== SHA-256 checksums ==="
          cat out/SHA256SUMS
          echo ""
          echo "=== Verifying checksums ==="
          (cd out && sha256sum --check SHA256SUMS)

      - name: Upload firmware artifacts (arm64)
        # actions/upload-artifact v4.6.2 — pinned to immutable commit SHA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NintendoSwitchPkg-firmware-arm64-${{ github.sha }}
          path: out/
          retention-days: 30
          if-no-files-found: error

